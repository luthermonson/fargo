name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          check-latest: true
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(find . -name '*.go'))"
          if [ -n "$unformatted" ]; then echo "gofmt needed on:"; echo "$unformatted"; exit 1; fi
      - name: test (race)
        run: go test -race ./...
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -o bin/fargo ./cmd/fargo

  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: helm lint
        run: helm lint charts/fargo --set mode=argo
      - name: helm template (each mode)
        run: |
          for m in argo flux crd; do
            helm template fargo charts/fargo --set mode=$m >/dev/null
          done
