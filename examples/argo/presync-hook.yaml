# rewind Argo CD PreSync hook.
#
# Argo runs PreSync hooks before it applies the manifests. This Job blocks the
# sync until rewind has opened the transaction for this rollout, so apply can
# never start before the savepoint is taken. rewind opens the transaction when
# the Application's operationState.phase becomes Running (which happens as the
# sync operation starts, around the time hooks run), with an id of the form
#   argo/<app-namespace>/<app-name>/<revision>
# The hook polls GET /txn until a transaction whose id starts with
#   argo/<app-namespace>/<app-name>/
# is open.
#
# It needs the kine endpoint and (for a TCP endpoint) the bearer token, exactly
# as the controller does: mount the same Secret.
#
# Replace APP_NAMESPACE / APP_NAME with your Application's namespace and name
# (the demo repo substitutes these with kustomize).
apiVersion: batch/v1
kind: Job
metadata:
  generateName: rewind-presync-
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: wait-for-savepoint
          image: curlimages/curl:8.11.1
          env:
            - name: KINE_ENDPOINT
              value: "http://192.168.5.2:2381"
            - name: APP_PREFIX
              value: "argo/APP_NAMESPACE/APP_NAME/"
            # For a token-protected endpoint, mount the Secret and point here:
            # - name: KINE_TOKEN
            #   valueFrom:
            #     secretKeyRef:
            #       name: rewind-kine-token
            #       key: token
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              auth=""
              [ -n "${KINE_TOKEN:-}" ] && auth="-H Authorization:\ Bearer\ ${KINE_TOKEN}"
              echo "waiting for an open rewind transaction with prefix ${APP_PREFIX}"
              for i in $(seq 1 60); do
                # The ledger lists [{id,state,...}]. Succeed once an open txn for
                # this app appears.
                # Bounded per attempt: a connect that hangs must not eat the
                # Job's whole deadline; the loop retries instead.
                body="$(curl -fsS --connect-timeout 3 --max-time 5 $auth "${KINE_ENDPOINT}/txn" || true)"
                echo "$body" | tr '}' '\n' | grep -q "\"id\":\"${APP_PREFIX}" \
                  && echo "savepoint is open; releasing sync" && exit 0
                echo "  not yet (attempt $i); sleeping 2s"
                sleep 2
              done
              echo "timed out waiting for the rewind savepoint" >&2
              exit 1
